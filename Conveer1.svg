<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Синий квадрат со скругленными углами -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="#2980B9" />
  
  <!-- Три широких темно-синих шеврона -->
  <g fill="none" stroke="#1B4F72" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Верхняя стрелка -->
    <path d="M 80,170 L 250,90 L 420,170" />
    
    <!-- Средняя стрелка -->
    <path d="M 80,270 L 250,190 L 420,270" />
    
    <!-- Нижняя стрелка -->
    <path d="M 80,370 L 250,290 L 420,370" />
  </g>
</svg>
