<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Серый квадратный фон -->
  <rect width="500" height="500" fill="#808080" />
  
  <!-- Идеально гладкий оранжевый круг по центру -->
  <circle cx="250" cy="250" r="225" fill="#FF7D1B" />
  
