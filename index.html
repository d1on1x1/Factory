<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Factory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0c111b;
    color: #e6ebf5;
    user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; position: fixed; inset: 0; }
  #game.dragging { cursor: grabbing; }

  .panel {
    position: absolute;
    background: #161f31;
    border: 1px solid #22304a;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 10px 14px;
    color: #e6ebf5;
  }

  #balance {
    top: 12px; left: 12px;
    font-size: 18px; font-weight: 600;
    min-width: 90px; text-align: center;
    color: #7dd3fc;
  }

  #resetBtn {
    top: 12px; right: 12px;
    cursor: pointer;
    font-size: 14px;
    border: 1px solid #22304a;
    background: #161f31;
    padding: 10px 16px;
    border-radius: 6px;
    color: #e6ebf5;
    transition: background .15s;
    font-family: inherit;
  }
  #resetBtn:hover { background: #1d2941; }

  #shop {
    top: 70px; left: 12px;
    width: 210px;
    padding: 12px;
  }
  #shop h3 {
    font-size: 15px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
    color: #e6ebf5;
  }
  .shop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid #22304a;
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .15s;
    background: #121a2a;
  }
  .shop-item:last-child { margin-bottom: 0; }
  .shop-item:hover { background: #1a2438; border-color: #2f4160; }
  .shop-item.selected {
    background: #1a2c50;
    border-color: #4a7cf7;
    box-shadow: 0 0 0 1px #4a7cf7 inset;
  }
  .shop-item.disabled {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }
  .shop-item .icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
  }
  .shop-item .icon img { width: 28px; height: 28px; }
  .shop-item .info { flex: 1; min-width: 0; }
  .shop-item .name { font-size: 13px; font-weight: 600; color: #e6ebf5; }
  .shop-item .meta { font-size: 11px; color: #8a96ab; margin-top: 2px; }

  #hotbar {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: #161f31;
    border: 1px solid #22304a;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 8px 10px;
    display: none;
    gap: 8px;
    align-items: center;
  }
  #hotbar.visible { display: flex; }
  .hotbar-item {
    width: 56px; height: 56px;
    border-radius: 6px;
    border: 1px solid #22304a;
    background: #121a2a;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 22px;
    transition: all .15s;
    padding: 4px;
    color: #e6ebf5;
  }
  .hotbar-item img { width: 28px; height: 28px; }
  .hotbar-item .label { font-size: 9px; color: #8a96ab; margin-top: 1px; }
  .hotbar-item:hover { background: #1a2438; }
  .hotbar-item.selected {
    background: #1a2c50;
    border-color: #4a7cf7;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="balance" class="panel">$0.00</div>
<button id="resetBtn" class="panel">↻ Сброс</button>

<div id="shop" class="panel">
  <h3>🛒 Магазин</h3>
  <div class="shop-item" data-type="spawner">
    <div class="icon"><img src="Square_Fabrick.svg" alt="" onerror="this.replaceWith(document.createTextNode('🔵'))"></div>
    <div class="info">
      <div class="name">Спавнер</div>
      <div class="meta">бесплатно · лимит: 1</div>
    </div>
  </div>
  <div class="shop-item" data-type="conveyor">
    <div class="icon"><img src="Conveer1.svg" alt="" onerror="this.replaceWith(document.createTextNode('⚪'))"></div>
    <div class="info">
      <div class="name">Конвейер</div>
      <div class="meta">0.05 $ · без лимита</div>
    </div>
  </div>
  <div class="shop-item" data-type="seller">
    <div class="icon"><img src="Sell_block.svg" alt="" onerror="this.replaceWith(document.createTextNode('🟢'))"></div>
    <div class="info">
      <div class="name">Блок продажи</div>
      <div class="meta">бесплатно · лимит: 1</div>
    </div>
  </div>
</div>

<div id="hotbar"></div>

<script>
(() => {
  // === Константы ===
  const GRID_W = 100, GRID_H = 100;
  const BASE_CELL = 32;
  const SPAWN_INTERVAL = 1000;
  const CONVEYOR_SPEED = 0.5;
  const SELL_PRICE = 0.01;
  const CONVEYOR_PRICE = 0.05;
  const MIN_SCALE = 0.5, MAX_SCALE = 3;

  const BLOCK_DEFS = {
    spawner:  { name: 'Спавнер',      price: 0,              color: '#4a7cf7', svg: 'Square_Fabrick.svg' },
    conveyor: { name: 'Конвейер',     price: CONVEYOR_PRICE, color: '#b8b8c0', svg: 'Conveer1.svg' },
    seller:   { name: 'Блок продажи', price: 0,              color: '#4cc07a', svg: 'Sell_block.svg' }
  };

  let state = {
    blocks: {},
    balance: 0,
    hotbar: [],
    camera: { x: 0, y: 0, scale: 1 }
  };

  let selectedType = null;
  let conveyorDir = 1;
  let items = [];
  let spawnerTimers = {};
  let images = {};
  let lastFrame = performance.now();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const balanceEl = document.getElementById('balance');
  const hotbarEl = document.getElementById('hotbar');

  // === Загрузка SVG ===
  function loadImage(name) {
    const img = new Image();
    img.onload = () => { img.ready = true; };
    img.onerror = () => { img.ready = false; };
    img.src = name;
    return img;
  }
  Object.values(BLOCK_DEFS).forEach(def => { images[def.svg] = loadImage(def.svg); });

  // === Canvas ===
  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // === Координаты ===
  function screenToGrid(sx, sy) {
    const s = BASE_CELL * state.camera.scale;
    return {
      x: Math.floor((sx - state.camera.x) / s),
      y: Math.floor((sy - state.camera.y) / s)
    };
  }

  // === Отрисовка ===
  function drawGrid() {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;
    const W = window.innerWidth, H = window.innerHeight;

    // фон вне поля
    ctx.fillStyle = '#0c111b';
    ctx.fillRect(0, 0, W, H);

    const fieldW = GRID_W * s, fieldH = GRID_H * s;
    const fieldX = camX, fieldY = camY;

    // поле
    ctx.fillStyle = '#161f31';
    ctx.fillRect(fieldX, fieldY, fieldW, fieldH);

    // видимая область сетки
    const startX = Math.max(0, Math.floor((0 - camX) / s));
    const startY = Math.max(0, Math.floor((0 - camY) / s));
    const endX = Math.min(GRID_W, Math.ceil((W - camX) / s));
    const endY = Math.min(GRID_H, Math.ceil((H - camY) / s));

    ctx.strokeStyle = '#22304a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = startX; x <= endX; x++) {
      const px = Math.floor(camX + x * s) + 0.5;
      ctx.moveTo(px, Math.max(0, camY));
      ctx.lineTo(px, Math.min(H, camY + fieldH));
    }
    for (let y = startY; y <= endY; y++) {
      const py = Math.floor(camY + y * s) + 0.5;
      ctx.moveTo(Math.max(0, camX), py);
      ctx.lineTo(Math.min(W, camX + fieldW), py);
    }
    ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawBlocks() {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;

    for (const key in state.blocks) {
      const [x, y] = key.split(',').map(Number);
      const px = camX + x * s;
      const py = camY + y * s;
      if (px + s < 0 || py + s < 0 || px > window.innerWidth || py > window.innerHeight) continue;

      const block = state.blocks[key];
      const def = BLOCK_DEFS[block.type];
      const pad = Math.max(1, s * 0.06);
      const size = s - pad * 2;

      // подложка блока
      ctx.fillStyle = '#1d2941';
      roundRect(ctx, px + pad, py + pad, size, size, Math.min(6, s * 0.12));
      ctx.fill();
      ctx.strokeStyle = '#2f4160';
      ctx.lineWidth = 1;
      ctx.stroke();

      // svg или кружок
      const img = images[def.svg];
      if (img && img.ready) {
        ctx.drawImage(img, px + pad + size * 0.15, py + pad + size * 0.15, size * 0.7, size * 0.7);
      } else {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(px + s / 2, py + s / 2, size * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // стрелка конвейера
      if (block.type === 'conveyor') {
        ctx.save();
        ctx.translate(px + s / 2, py + s / 2);
        ctx.rotate(block.dir * Math.PI / 2);
        ctx.fillStyle = '#7dd3fc';
        ctx.beginPath();
        const a = size * 0.28;
        ctx.moveTo(a, 0);
        ctx.lineTo(-a * 0.5, -a * 0.7);
        ctx.lineTo(-a * 0.5, a * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawItems() {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;
    for (const it of items) {
      const px = camX + it.x * s;
      const py = camY + it.y * s;
      if (px + s < 0 || py + s < 0 || px > window.innerWidth || py > window.innerHeight) continue;
      const size = s * 0.5;
      ctx.fillStyle = '#f5b400';
      roundRect(ctx, px + s / 2 - size / 2, py + s / 2 - size / 2, size, size, Math.min(4, s * 0.1));
      ctx.fill();
      ctx.strokeStyle = '#c98f00';
      ctx.stroke();
    }
  }

  function drawPreview() {
    if (!selectedType) return;
    const { x, y } = mouseGrid;
    if (x < 0 || y < 0 || x >= GRID_W || y >= GRID_H) return;
    const s = BASE_CELL * state.camera.scale;
    const px = state.camera.x + x * s;
    const py = state.camera.y + y * s;
    ctx.strokeStyle = '#4a7cf7';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, s - 2, s - 2);
    if (selectedType === 'conveyor') {
      ctx.save();
      ctx.translate(px + s / 2, py + s / 2);
      ctx.rotate(conveyorDir * Math.PI / 2);
      ctx.fillStyle = 'rgba(125,211,252,0.6)';
      ctx.beginPath();
      const a = s * 0.25;
      ctx.moveTo(a, 0);
      ctx.lineTo(-a * 0.5, -a * 0.7);
      ctx.lineTo(-a * 0.5, a * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.lineWidth = 1;
  }

  // === Логика ===
  function countType(type) {
    let n = 0;
    for (const k in state.blocks) if (state.blocks[k].type === type) n++;
    return n;
  }

  function canPlace(type) {
    if (!type) return false;
    if (type === 'spawner' && countType('spawner') >= 1) return false;
    if (type === 'seller' && countType('seller') >= countType('spawner')) return false;
    return true;
  }

  function placeBlock(gx, gy) {
    if (!selectedType) return;
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return;
    const key = gx + ',' + gy;
    if (state.blocks[key]) return;
    if (!canPlace(selectedType)) return;

    const def = BLOCK_DEFS[selectedType];
    if (state.balance < def.price) return;

    state.balance -= def.price;
    state.blocks[key] = {
      type: selectedType,
      dir: selectedType === 'conveyor' ? conveyorDir : 0
    };
    if (selectedType === 'spawner') spawnerTimers[key] = performance.now();

    state.hotbar = [selectedType, ...state.hotbar.filter(t => t !== selectedType)].slice(0, 8);
    renderHotbar();
    updateBalance();
    updateShopState();
    save();
  }

  function removeBlock(gx, gy) {
    const key = gx + ',' + gy;
    if (!state.blocks[key]) return;
    const type = state.blocks[key].type;
    delete state.blocks[key];
    if (type === 'spawner') delete spawnerTimers[key];
    updateShopState();
    save();
  }

  function updateTick(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    // спавн
    for (const key in state.blocks) {
      const b = state.blocks[key];
      if (b.type !== 'spawner') continue;
      if (!spawnerTimers[key]) spawnerTimers[key] = now;
      if (now - spawnerTimers[key] >= SPAWN_INTERVAL) {
        spawnerTimers[key] = now;
        const [x, y] = key.split(',').map(Number);
        if (!items.some(it => Math.round(it.x) === x && Math.round(it.y) === y)) {
          items.push({ x, y, dir: -1 });
        }
      }
    }

    // движение
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const cx = Math.round(it.x);
      const cy = Math.round(it.y);

      const atCell = Math.abs(it.x - cx) < 0.001 && Math.abs(it.y - cy) < 0.001;

      if (atCell) {
        it.x = cx; it.y = cy;
        const key = cx + ',' + cy;
        const block = state.blocks[key];

        if (block && block.type === 'seller') {
          state.balance += SELL_PRICE;
          items.splice(i, 1);
          updateBalance();
          save();
          continue;
        }

        if (block && block.type === 'conveyor') {
          it.dir = block.dir;
          const dx = [0, 1, 0, -1][block.dir];
          const dy = [-1, 0, 1, 0][block.dir];
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= GRID_W || ny >= GRID_H) continue;
          const nblock = state.blocks[nx + ',' + ny];
          if (!nblock || nblock.type === 'conveyor' || nblock.type === 'seller') {
            it.x += dx * dt / CONVEYOR_SPEED;
            it.y += dy * dt / CONVEYOR_SPEED;
          }
          continue;
        }

        it.dir = -1;
      } else {
        const dx = [0, 1, 0, -1][it.dir];
        const dy = [-1, 0, 1, 0][it.dir];
        if (dx === 0 && dy === 0) { it.dir = -1; continue; }
        it.x += dx * dt / CONVEYOR_SPEED;
        it.y += dy * dt / CONVEYOR_SPEED;
        // фиксируем прибытие к целевой клетке
        const tcx = Math.round(it.x), tcy = Math.round(it.y);
        if (Math.abs(it.x - tcx) < 0.02 && Math.abs(it.y - tcy) < 0.02) {
          it.x = tcx; it.y = tcy;
        }
      }
    }
  }

  function loop(now) {
    updateTick(now);
    drawGrid();
    drawBlocks();
    drawItems();
    drawPreview();
    requestAnimationFrame(loop);
  }

  // === UI ===
  function updateBalance() {
    balanceEl.textContent = '$' + state.balance.toFixed(2);
  }

  function updateShopState() {
    document.querySelectorAll('.shop-item').forEach(el => {
      const type = el.dataset.type;
      el.classList.toggle('disabled', !canPlace(type));
    });
  }

  function renderHotbar() {
    if (state.hotbar.length === 0) {
      hotbarEl.classList.remove('visible');
      return;
    }
    hotbarEl.classList.add('visible');
    hotbarEl.innerHTML = '';
    state.hotbar.forEach(type => {
      const def = BLOCK_DEFS[type];
      const div = document.createElement('div');
      div.className = 'hotbar-item';
      if (selectedType === type) div.classList.add('selected');
      div.title = def.name;
      const img = document.createElement('img');
      img.src = def.svg;
      img.onerror = () => { img.replaceWith(document.createTextNode('■')); };
      div.appendChild(img);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = def.name.split(' ')[0];
      div.appendChild(label);
      div.addEventListener('click', (e) => { e.stopPropagation(); selectType(type); });
      hotbarEl.appendChild(div);
    });
  }

  function selectType(type) {
    if (!canPlace(type)) return;
    selectedType = type;
    document.querySelectorAll('.shop-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.type === type);
    });
    renderHotbar();
  }

  // === Ввод ===
  let isDown = false, isDragging = false, dragStart = null;
  let mouseGrid = { x: -1, y: -1 };

  canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
      isDown = true;
      isDragging = false;
      dragStart = { x: e.clientX, y: e.clientY, camX: state.camera.x, camY: state.camera.y };
    }
  });

  window.addEventListener('mousemove', e => {
    const g = screenToGrid(e.clientX, e.clientY);
    mouseGrid = g;

    if (isDown && dragStart) {
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 5) {
        isDragging = true;
        canvas.classList.add('dragging');
        state.camera.x = dragStart.camX + dx;
        state.camera.y = dragStart.camY + dy;
      }
    }
  });

  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    if (isDown && !isDragging) {
      // ставим блок только если курсор над canvas
      const rect = canvas.getBoundingClientRect();
      const overCanvas = e.clientX >= rect.left && e.clientX <= rect.right &&
                        e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (overCanvas && e.target === canvas) {
        const g = screenToGrid(e.clientX, e.clientY);
        placeBlock(g.x, g.y);
      }
    }
    isDown = false;
    isDragging = false;
    dragStart = null;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const g = screenToGrid(e.clientX, e.clientY);
    removeBlock(g.x, g.y);
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const oldScale = state.camera.scale;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    let newScale = oldScale * factor;
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    if (newScale === oldScale) return;

    const wx = (e.clientX - state.camera.x) / (BASE_CELL * oldScale);
    const wy = (e.clientY - state.camera.y) / (BASE_CELL * oldScale);
    state.camera.scale = newScale;
    state.camera.x = e.clientX - wx * BASE_CELL * newScale;
    state.camera.y = e.clientY - wy * BASE_CELL * newScale;
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
      conveyorDir = (conveyorDir + 1) % 4;
    }
  });

  // === Магазин ===
  document.querySelectorAll('.shop-item').forEach(el => {
    el.addEventListener('click', () => selectType(el.dataset.type));
  });

  // === Сброс ===
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Сбросить весь прогресс?')) return;
    localStorage.removeItem('factory_save');
    location.reload();
  });

  // === Сохранение ===
  function save() {
    localStorage.setItem('factory_save', JSON.stringify({
      blocks: state.blocks,
      balance: state.balance,
      hotbar: state.hotbar,
      camera: state.camera
    }));
  }

  function load() {
    try {
      const raw = localStorage.getItem('factory_save');
      if (!raw) return false;
      const data = JSON.parse(raw);
      state.blocks = data.blocks || {};
      state.balance = data.balance || 0;
      state.hotbar = data.hotbar || [];
      if (data.camera) state.camera = data.camera;
      for (const key in state.blocks) {
        if (state.blocks[key].type === 'spawner') spawnerTimers[key] = performance.now();
      }
      return true;
    } catch (e) { console.warn('Load error', e); return false; }
  }

  // === Старт ===
  function init() {
    const loaded = load();
    if (!loaded) {
      state.camera.x = window.innerWidth / 2 - (GRID_W * BASE_CELL) / 2;
      state.camera.y = window.innerHeight / 2 - (GRID_H * BASE_CELL) / 2;
      state.camera.scale = 1;
    }
    updateBalance();
    updateShopState();
    renderHotbar();
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
