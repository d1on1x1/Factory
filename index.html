<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Factory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0c111b;
    color: #e6ebf5;
    user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; position: fixed; inset: 0; }

  .panel {
    position: absolute;
    background: #161f31;
    border: 1px solid #22304a;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 10px 14px;
    color: #e6ebf5;
  }
  #balance {
    top: 12px; left: 12px;
    font-size: 18px; font-weight: 600;
    min-width: 90px; text-align: center; color: #7dd3fc;
  }
  #resetBtn {
    top: 12px; right: 12px; cursor: pointer; font-size: 14px;
    border: 1px solid #22304a; background: #161f31;
    padding: 10px 16px; border-radius: 6px;
    color: #e6ebf5; transition: background .15s; font-family: inherit;
  }
  #resetBtn:hover { background: #1d2941; }
  #adminToggle {
    top: 12px; right: 110px; cursor: pointer; font-size: 13px;
    border: 1px solid #22304a; background: #161f31;
    padding: 10px 12px; border-radius: 6px;
    color: #7dd3fc; font-family: inherit;
  }
  #adminToggle:hover { background: #1d2941; }

  #shop {
    top: 70px; left: 12px; width: 220px; padding: 12px;
  }
  #shop h3 {
    font-size: 15px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px; color: #e6ebf5;
  }
  .shop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid #22304a;
    border-radius: 6px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s; background: #121a2a;
  }
  .shop-item:last-child { margin-bottom: 0; }
  .shop-item:hover { background: #1a2438; border-color: #2f4160; }
  .shop-item.selected {
    background: #1a2c50; border-color: #4a7cf7;
    box-shadow: 0 0 0 1px #4a7cf7 inset;
  }
  .shop-item.disabled { opacity: 0.35; cursor: not-allowed; }
  .shop-item .icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .shop-item .icon img { width: 32px; height: 32px; }
  .shop-item .info { flex: 1; min-width: 0; }
  .shop-item .name { font-size: 13px; font-weight: 600; color: #e6ebf5; }
  .shop-item .meta { font-size: 11px; color: #8a96ab; margin-top: 2px; }

  #hotbar {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: #161f31; border: 1px solid #22304a;
    border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 8px 10px; display: none; gap: 8px; align-items: center;
  }
  #hotbar.visible { display: flex; }
  .hotbar-item {
    position: relative;
    width: 56px; height: 56px; border-radius: 6px;
    border: 1px solid #22304a; background: #121a2a;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: all .15s; padding: 4px; color: #e6ebf5;
  }
  .hotbar-item img { width: 28px; height: 28px; }
  .hotbar-item .label { font-size: 9px; color: #8a96ab; margin-top: 2px; }
  .hotbar-item .num {
    position: absolute; top: 2px; left: 4px;
    font-size: 9px; color: #5c7099; font-weight: 700;
  }
  .hotbar-item:hover { background: #1a2438; }
  .hotbar-item.selected { background: #1a2c50; border-color: #4a7cf7; }

  #adminPanel {
    position: absolute; top: 70px; right: 12px; width: 230px;
    background: #161f31; border: 1px solid #4a7cf7;
    border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    color: #e6ebf5; z-index: 1000; display: none;
  }
  #adminPanel.visible { display: block; }
  #adminHeader {
    padding: 8px 12px; background: #1a2c50;
    border-bottom: 1px solid #22304a;
    border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600;
    cursor: move; display: flex; justify-content: space-between;
    align-items: center; color: #7dd3fc;
  }
  #adminHeader .close {
    cursor: pointer; color: #8a96ab; font-size: 16px;
    line-height: 1; padding: 0 4px;
  }
  #adminHeader .close:hover { color: #ff6b6b; }
  #adminBody { padding: 10px 12px; }
  .admin-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; font-size: 13px; gap: 8px;
  }
  .switch {
    position: relative; width: 38px; height: 20px;
    background: #22304a; border-radius: 10px;
    cursor: pointer; transition: background .2s; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; background: #8a96ab;
    border-radius: 50%; transition: all .2s;
  }
  .switch.on { background: #4a7cf7; }
  .switch.on::after { left: 20px; background: #fff; }

  .speed-row { display: flex; gap: 4px; padding-top: 6px; flex-wrap: wrap; }
  .speed-btn {
    flex: 1; min-width: 36px; padding: 6px 0;
    border: 1px solid #22304a; background: #121a2a;
    color: #e6ebf5; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-family: inherit; transition: all .15s;
  }
  .speed-btn:hover { background: #1a2438; }
  .speed-btn.active { background: #4a7cf7; border-color: #4a7cf7; color: #fff; }

  .admin-reset-btn {
    margin-top: 10px; width: 100%; padding: 8px 0;
    background: #2a1a1a; border: 1px solid #5a2a2a;
    color: #ff8888; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: all .15s;
  }
  .admin-reset-btn:hover { background: #3a1f1f; border-color: #7a3535; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="balance" class="panel">$0.00</div>
<button id="resetBtn" class="panel">↻ Сброс</button>
<button id="adminToggle" class="panel">⚙ Админ</button>

<div id="shop" class="panel">
  <h3>🛒 Магазин</h3>
  <div class="shop-item" data-type="spawner">
    <div class="icon"><img src="Square_Fabrick.svg" alt=""></div>
    <div class="info">
      <div class="name">Спавнер</div>
      <div class="meta">бесплатно · лимит: 1</div>
    </div>
  </div>
  <div class="shop-item" data-type="conveyor">
    <div class="icon"><img src="Conveer1.svg" alt=""></div>
    <div class="info">
      <div class="name">Конвейер</div>
      <div class="meta">0.05 $ · без лимита</div>
    </div>
  </div>
  <div class="shop-item" data-type="seller">
    <div class="icon"><img src="Sell_block.svg" alt=""></div>
    <div class="info">
      <div class="name">Блок продажи</div>
      <div class="meta">бесплатно · лимит: 1</div>
    </div>
  </div>
</div>

<div id="hotbar"></div>

<div id="adminPanel">
  <div id="adminHeader">
    <span>⚙ Админ-панель</span>
    <span class="close" id="adminClose">×</span>
  </div>
  <div id="adminBody">
    <div class="admin-row">
      <span>Бесконечные деньги</span>
      <div class="switch" id="swMoney"></div>
    </div>
    <div class="admin-row">
      <span>Безлимитные блоки</span>
      <div class="switch" id="swLimits"></div>
    </div>
    <div class="admin-row" style="display:block;">
      <div style="margin-bottom:6px;">Скорость игры</div>
      <div class="speed-row" id="speedRow">
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="3">3x</button>
        <button class="speed-btn" data-speed="5">5x</button>
        <button class="speed-btn" data-speed="10">10x</button>
      </div>
    </div>
    <button class="admin-reset-btn" id="adminReset">↻ Сбросить прогресс</button>
  </div>
</div>

<script>
(() => {
  const GRID_W = 100, GRID_H = 100;
  const BASE_CELL = 32;
  const SPAWN_INTERVAL = 1000;
  const CONVEYOR_SPEED = 0.5;
  const SELL_PRICE = 0.01;
  const CONVEYOR_PRICE = 0.05;
  const MIN_SCALE = 0.5, MAX_SCALE = 3;

  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];
  const ANGLE = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

  const BLOCK_DEFS = {
    spawner:  { name: 'Спавнер',      price: 0,              svg: 'Square_Fabrick.svg' },
    conveyor: { name: 'Конвейер',     price: CONVEYOR_PRICE, svg: 'Conveer1.svg' },
    seller:   { name: 'Блок продажи', price: 0,              svg: 'Sell_block.svg' }
  };

  let state = {
    blocks: {},
    balance: 0,
    hotbar: [],
    camera: { x: 0, y: 0, scale: 1 }
  };

  let admin = { infiniteMoney: false, infiniteBlocks: false, speed: 1 };
  let selectedType = null;
  let conveyorDir = 1;
  let spawnerDir = 1;
  let items = [];
  let spawnerTimers = {};
  let images = {};
  let lastFrame = performance.now();
  let rotAnims = {};
  let popups = [];
  let dissolving = [];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const balanceEl = document.getElementById('balance');
  const hotbarEl = document.getElementById('hotbar');

  // === SVG ===
  function loadImage(name) {
    const img = new Image();
    img.onload = () => { img.ready = true; console.log('loaded', name); };
    img.onerror = () => { img.ready = false; console.warn('failed to load', name); };
    img.src = name;
    return img;
  }
  Object.values(BLOCK_DEFS).forEach(def => { images[def.svg] = loadImage(def.svg); });

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function screenToGrid(sx, sy) {
    const s = BASE_CELL * state.camera.scale;
    return {
      x: Math.floor((sx - state.camera.x) / s),
      y: Math.floor((sy - state.camera.y) / s)
    };
  }

  function drawGrid() {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;
    const W = window.innerWidth, H = window.innerHeight;

    ctx.fillStyle = '#0c111b';
    ctx.fillRect(0, 0, W, H);
    const fieldW = GRID_W * s, fieldH = GRID_H * s;
    ctx.fillStyle = '#161f31';
    ctx.fillRect(camX, camY, fieldW, fieldH);

    const startX = Math.max(0, Math.floor((0 - camX) / s));
    const startY = Math.max(0, Math.floor((0 - camY) / s));
    const endX = Math.min(GRID_W, Math.ceil((W - camX) / s));
    const endY = Math.min(GRID_H, Math.ceil((H - camY) / s));

    ctx.strokeStyle = '#22304a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = startX; x <= endX; x++) {
      const px = Math.floor(camX + x * s) + 0.5;
      ctx.moveTo(px, Math.max(0, camY));
      ctx.lineTo(px, Math.min(H, camY + fieldH));
    }
    for (let y = startY; y <= endY; y++) {
      const py = Math.floor(camY + y * s) + 0.5;
      ctx.moveTo(Math.max(0, camX), py);
      ctx.lineTo(Math.min(W, camX + fieldW), py);
    }
    ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Стрелка НЕ по центру, а со стороны направления.
  // Рисуем её в локальных координатах блока со смещением к "носу" (вправо по +X).
  function drawArrowRaw(px, py, s, angle, color) {
    ctx.save();
    ctx.translate(px + s / 2, py + s / 2);
    ctx.rotate(angle);
    // смещаем к правому краю клетки (по направлению взгляда)
    const offset = s * 0.28;
    ctx.translate(offset, 0);
    ctx.fillStyle = color;
    ctx.beginPath();
    const a = s * 0.13; // уменьшенный размер
    ctx.moveTo(a, 0);
    ctx.lineTo(-a * 0.6, -a * 0.75);
    ctx.lineTo(-a * 0.6, a * 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function updateRotAnims(dt) {
    for (const key in rotAnims) {
      const a = rotAnims[key];
      let diff = a.target - a.display;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) < 0.001) { a.display = a.target; continue; }
      const speed = 12;
      a.display += Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
    }
  }

  function drawBlocks() {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;

    for (const key in state.blocks) {
      const [x, y] = key.split(',').map(Number);
      const px = camX + x * s;
      const py = camY + y * s;
      if (px + s < 0 || py + s < 0 || px > window.innerWidth || py > window.innerHeight) continue;

      const block = state.blocks[key];
      const def = BLOCK_DEFS[block.type];
      const pad = Math.max(1, s * 0.06);
      const size = s - pad * 2;

      ctx.fillStyle = '#1d2941';
      roundRect(ctx, px + pad, py + pad, size, size, Math.min(6, s * 0.12));
      ctx.fill();
      ctx.strokeStyle = '#2f4160';
      ctx.lineWidth = 1;
      ctx.stroke();

      const img = images[def.svg];
      if (img && img.ready) {
        if (block.type === 'conveyor' || block.type === 'spawner') {
          const angle = rotAnims[key] ? rotAnims[key].display : ANGLE[block.dir];
          ctx.save();
          ctx.translate(px + s / 2, py + s / 2);
          ctx.rotate(angle);
          ctx.drawImage(img, -size * 0.38, -size * 0.38, size * 0.76, size * 0.76);
          ctx.restore();
        } else {
          ctx.drawImage(img, px + pad + size * 0.12, py + pad + size * 0.12, size * 0.76, size * 0.76);
        }
      } else {
        // fallback — цветной квадратик, чтобы хоть что-то было видно
        ctx.fillStyle = '#4a7cf7';
        ctx.fillRect(px + pad + size * 0.2, py + pad + size * 0.2, size * 0.6, size * 0.6);
      }

      if (block.type === 'conveyor') {
        const angle = rotAnims[key] ? rotAnims[key].display : ANGLE[block.dir];
        drawArrowRaw(px, py, s, angle, 'rgba(125,211,252,0.9)');
      }
      if (block.type === 'spawner') {
        const angle = rotAnims[key] ? rotAnims[key].display : ANGLE[block.dir];
        drawArrowRaw(px, py, s, angle, 'rgba(245,180,0,0.95)');
      }
    }
  }

  function drawItems(dt) {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;

    for (const it of items) {
      const px = camX + it.x * s;
      const py = camY + it.y * s;
      if (px + s < 0 || py + s < 0 || px > window.innerWidth || py > window.innerHeight) continue;
      const size = s * 0.5;
      ctx.fillStyle = '#f5b400';
      roundRect(ctx, px + s / 2 - size / 2, py + s / 2 - size / 2, size, size, Math.min(4, s * 0.1));
      ctx.fill();
      ctx.strokeStyle = '#c98f00';
      ctx.stroke();
    }

    for (let i = dissolving.length - 1; i >= 0; i--) {
      const d = dissolving[i];
      d.age += dt;
      const t = d.age / d.life;
      if (t >= 1) { dissolving.splice(i, 1); continue; }

      const px = camX + d.x * s;
      const py = camY + d.y * s;
      const baseSize = s * 0.5;
      const size = baseSize * (1 - t * 0.3);
      const alpha = 1 - t;
      const lift = -t * s * 0.4;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#f5b400';
      roundRect(ctx, px + s / 2 - size / 2, py + s / 2 - size / 2 + lift, size, size, Math.min(4, s * 0.1));
      ctx.fill();
      ctx.strokeStyle = '#c98f00';
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = '#ffe27a';
      ctx.lineWidth = 2;
      roundRect(ctx, px + s / 2 - size / 2 - t * 6, py + s / 2 - size / 2 + lift - t * 6, size + t * 12, size + t * 12, Math.min(6, s * 0.15));
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPopups(dt) {
    const s = BASE_CELL * state.camera.scale;
    const camX = state.camera.x, camY = state.camera.y;

    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.age += dt;
      const t = p.age / p.life;
      if (t >= 1) { popups.splice(i, 1); continue; }

      const px = camX + p.x * s + s / 2;
      const py = camY + p.y * s + s / 2 - t * s * 1.4;
      const alpha = 1 - t;
      const scale = 1 + (1 - t) * 0.15;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      ctx.scale(scale, scale);
      // уменьшенный шрифт: было s*0.45, стало s*0.28
      ctx.font = 'bold ' + Math.max(9, s * 0.28) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = '#7dffa0';
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }

  function drawPreview() {
    if (!selectedType) return;
    const { x, y } = mouseGrid;
    if (x < 0 || y < 0 || x >= GRID_W || y >= GRID_H) return;
    const s = BASE_CELL * state.camera.scale;
    const px = state.camera.x + x * s;
    const py = state.camera.y + y * s;
    ctx.strokeStyle = '#4a7cf7';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, s - 2, s - 2);
    if (selectedType === 'conveyor') {
      drawArrowRaw(px, py, s, ANGLE[conveyorDir], 'rgba(125,211,252,0.7)');
    }
    if (selectedType === 'spawner') {
      drawArrowRaw(px, py, s, ANGLE[spawnerDir], 'rgba(245,180,0,0.8)');
    }
    ctx.lineWidth = 1;
  }

  function countType(type) {
    let n = 0;
    for (const k in state.blocks) if (state.blocks[k].type === type) n++;
    return n;
  }

  function canPlace(type) {
    if (!type) return false;
    if (admin.infiniteBlocks) return true;
    if (type === 'spawner' && countType('spawner') >= 1) return false;
    if (type === 'seller' && countType('seller') >= countType('spawner')) return false;
    return true;
  }

  function placeBlock(gx, gy) {
    if (!selectedType) return;
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return;
    const key = gx + ',' + gy;
    if (state.blocks[key]) return;
    if (!canPlace(selectedType)) return;

    const def = BLOCK_DEFS[selectedType];
    if (!admin.infiniteMoney && state.balance < def.price) return;

    if (!admin.infiniteMoney) state.balance -= def.price;
    const dir = selectedType === 'conveyor' ? conveyorDir
              : selectedType === 'spawner'  ? spawnerDir
              : 0;
    state.blocks[key] = { type: selectedType, dir };
    if (selectedType === 'spawner') spawnerTimers[key] = performance.now();

    rotAnims[key] = { display: ANGLE[dir], target: ANGLE[dir] };

    state.hotbar = [selectedType, ...state.hotbar.filter(t => t !== selectedType)].slice(0, 8);
    renderHotbar();
    updateBalance();
    updateShopState();
    save();
  }

  function removeBlock(gx, gy) {
    const key = gx + ',' + gy;
    if (!state.blocks[key]) return;
    const type = state.blocks[key].type;
    delete state.blocks[key];
    delete rotAnims[key];
    if (type === 'spawner') delete spawnerTimers[key];
    updateShopState();
    save();
  }

  function updateTick(now) {
    const realDt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    const dt = realDt * admin.speed;
    const scaledNow = now * admin.speed;

    updateRotAnims(realDt);

    for (const key in state.blocks) {
      const b = state.blocks[key];
      if (b.type !== 'spawner') continue;
      if (!spawnerTimers[key]) spawnerTimers[key] = scaledNow;
      if (scaledNow - spawnerTimers[key] >= SPAWN_INTERVAL) {
        spawnerTimers[key] = scaledNow;
        const [x, y] = key.split(',').map(Number);
        const dx = DX[b.dir], dy = DY[b.dir];
        const tx = x + dx, ty = y + dy;
        if (tx < 0 || ty < 0 || tx >= GRID_W || ty >= GRID_H) continue;
        if (!items.some(it => Math.round(it.x) === tx && Math.round(it.y) === ty)) {
          items.push({ x: tx, y: ty, dir: -1 });
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const cx = Math.round(it.x);
      const cy = Math.round(it.y);
      const atCell = Math.abs(it.x - cx) < 0.001 && Math.abs(it.y - cy) < 0.001;

      if (atCell) {
        it.x = cx; it.y = cy;
        const key = cx + ',' + cy;
        const block = state.blocks[key];

        if (block && block.type === 'seller') {
          if (!admin.infiniteMoney) state.balance += SELL_PRICE;
          dissolving.push({ x: cx, y: cy, age: 0, life: 0.6 });
          popups.push({ x: cx, y: cy, age: 0, life: 1.1, text: '+$' + SELL_PRICE.toFixed(2) });
          items.splice(i, 1);
          updateBalance();
          save();
          continue;
        }

        if (block && block.type === 'conveyor') {
          it.dir = block.dir;
          const dx = DX[block.dir], dy = DY[block.dir];
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= GRID_W || ny >= GRID_H) continue;
          const nblock = state.blocks[nx + ',' + ny];
          if (!nblock || nblock.type === 'conveyor' || nblock.type === 'seller') {
            it.x += dx * dt / CONVEYOR_SPEED;
            it.y += dy * dt / CONVEYOR_SPEED;
          }
          continue;
        }

        it.dir = -1;
      } else {
        const dx = DX[it.dir], dy = DY[it.dir];
        if (dx === 0 && dy === 0) { it.dir = -1; continue; }
        it.x += dx * dt / CONVEYOR_SPEED;
        it.y += dy * dt / CONVEYOR_SPEED;
        const tcx = Math.round(it.x), tcy = Math.round(it.y);
        if (Math.abs(it.x - tcx) < 0.02 && Math.abs(it.y - tcy) < 0.02) {
          it.x = tcx; it.y = tcy;
        }
      }
    }
  }

  function loop(now) {
    const dtReal = Math.min(0.1, (now - lastFrame) / 1000) || 0.016;
    updateTick(now);
    drawGrid();
    drawBlocks();
    drawItems(dtReal);
    drawPopups(dtReal);
    drawPreview();
    requestAnimationFrame(loop);
  }

  function updateBalance() {
    if (admin.infiniteMoney) { balanceEl.textContent = '∞ $'; return; }
    balanceEl.textContent = '$' + state.balance.toFixed(2);
  }

  function updateShopState() {
    document.querySelectorAll('.shop-item').forEach(el => {
      const type = el.dataset.type;
      el.classList.toggle('disabled', !canPlace(type));
    });
  }

  function renderHotbar() {
    if (state.hotbar.length === 0) {
      hotbarEl.classList.remove('visible');
      return;
    }
    hotbarEl.classList.add('visible');
    hotbarEl.innerHTML = '';
    state.hotbar.forEach((type, idx) => {
      const def = BLOCK_DEFS[type];
      const div = document.createElement('div');
      div.className = 'hotbar-item';
      if (selectedType === type) div.classList.add('selected');
      div.title = def.name + ' (клавиша ' + (idx + 1) + ')';

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = (idx + 1);
      div.appendChild(num);

      const img = document.createElement('img');
      img.src = def.svg;
      div.appendChild(img);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = def.name.split(' ')[0];
      div.appendChild(label);
      div.addEventListener('click', (e) => { e.stopPropagation(); selectType(type); });
      hotbarEl.appendChild(div);
    });
  }

  function selectType(type) {
    if (!canPlace(type)) return;
    selectedType = type;
    document.querySelectorAll('.shop-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.type === type);
    });
    renderHotbar();
  }

  let isDown = false, isDragging = false, dragStart = null;
  let mouseGrid = { x: -1, y: -1 };

  canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
      isDown = true;
      isDragging = false;
      dragStart = { x: e.clientX, y: e.clientY, camX: state.camera.x, camY: state.camera.y };
    }
  });

  window.addEventListener('mousemove', e => {
    mouseGrid = screenToGrid(e.clientX, e.clientY);
    if (isDown && dragStart) {
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 5) {
        isDragging = true;
        canvas.classList.add('dragging');
        state.camera.x = dragStart.camX + dx;
        state.camera.y = dragStart.camY + dy;
      }
    }
  });

  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    if (isDown && !isDragging && e.target === canvas) {
      const g = screenToGrid(e.clientX, e.clientY);
      placeBlock(g.x, g.y);
    }
    isDown = false;
    isDragging = false;
    dragStart = null;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const g = screenToGrid(e.clientX, e.clientY);
    removeBlock(g.x, g.y);
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const oldScale = state.camera.scale;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    let newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, oldScale * factor));
    if (newScale === oldScale) return;
    const wx = (e.clientX - state.camera.x) / (BASE_CELL * oldScale);
    const wy = (e.clientY - state.camera.y) / (BASE_CELL * oldScale);
    state.camera.scale = newScale;
    state.camera.x = e.clientX - wx * BASE_CELL * newScale;
    state.camera.y = e.clientY - wy * BASE_CELL * newScale;
  }, { passive: false });

  window.addEventListener('keydown', e => {
    // R — поворот против часовой
    if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
      if (selectedType === 'spawner') spawnerDir = (spawnerDir + 3) % 4;
      else conveyorDir = (conveyorDir + 3) % 4;
      return;
    }
    // 1–8 — выбор из хотбара
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8 && state.hotbar[n - 1]) {
      selectType(state.hotbar[n - 1]);
    }
  });

  document.querySelectorAll('.shop-item').forEach(el => {
    el.addEventListener('click', () => selectType(el.dataset.type));
  });

  // === Сброс ===
  function resetGame() {
    if (!confirm('Сбросить весь прогресс?')) return;
    localStorage.removeItem('factory_save');
    location.reload();
  }
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('adminReset').addEventListener('click', resetGame);

  const adminPanel = document.getElementById('adminPanel');
  const adminHeader = document.getElementById('adminHeader');
  document.getElementById('adminToggle').addEventListener('click', () => {
    adminPanel.classList.toggle('visible');
  });
  document.getElementById('adminClose').addEventListener('click', () => {
    adminPanel.classList.remove('visible');
  });

  let adminDrag = null;
  adminHeader.addEventListener('mousedown', e => {
    if (e.target.classList.contains('close')) return;
    adminDrag = {
      offsetX: e.clientX - adminPanel.offsetLeft,
      offsetY: e.clientY - adminPanel.offsetTop
    };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (adminDrag) {
      adminPanel.style.left = (e.clientX - adminDrag.offsetX) + 'px';
      adminPanel.style.top  = (e.clientY - adminDrag.offsetY) + 'px';
      adminPanel.style.right = 'auto';
    }
  });
  window.addEventListener('mouseup', () => { adminDrag = null; });

  const swMoney = document.getElementById('swMoney');
  const swLimits = document.getElementById('swLimits');
  swMoney.addEventListener('click', () => {
    admin.infiniteMoney = !admin.infiniteMoney;
    swMoney.classList.toggle('on', admin.infiniteMoney);
    updateBalance(); updateShopState();
  });
  swLimits.addEventListener('click', () => {
    admin.infiniteBlocks = !admin.infiniteBlocks;
    swLimits.classList.toggle('on', admin.infiniteBlocks);
    updateShopState();
  });

  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      admin.speed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const now = performance.now() * admin.speed;
      for (const key in spawnerTimers) spawnerTimers[key] = now;
    });
  });

  function save() {
    localStorage.setItem('factory_save', JSON.stringify({
      blocks: state.blocks, balance: state.balance,
      hotbar: state.hotbar, camera: state.camera
    }));
  }
  function load() {
    try {
      const raw = localStorage.getItem('factory_save');
      if (!raw) return false;
      const data = JSON.parse(raw);
      state.blocks = data.blocks || {};
      state.balance = data.balance || 0;
      state.hotbar = data.hotbar || [];
      if (data.camera) state.camera = data.camera;
      for (const key in state.blocks) {
        const b = state.blocks[key];
        rotAnims[key] = { display: ANGLE[b.dir] || 0, target: ANGLE[b.dir] || 0 };
        if (b.type === 'spawner') spawnerTimers[key] = performance.now();
      }
      return true;
    } catch (e) { console.warn('Load error', e); return false; }
  }

  function init() {
    const loaded = load();
    if (!loaded) {
      state.camera.x = window.innerWidth / 2 - (GRID_W * BASE_CELL) / 2;
      state.camera.y = window.innerHeight / 2 - (GRID_H * BASE_CELL) / 2;
      state.camera.scale = 1;
    }
    updateBalance(); updateShopState(); renderHotbar();
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
</body>
</html>
